<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Netbytes.cloud{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2338bdf8'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='24' fill='%230f172a'%3EN%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            accent: '#38bdf8',
                            danger: '#ef4444',
                            success: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-white dark:bg-tech-bg text-slate-900 dark:text-slate-100 transition-colors duration-200; }
        }
    </style>
</head>
<body class="min-h-screen flex bg-tech-bg">
    <!-- Sidebar Navigation -->
    {% block sidebar %}
    <aside class="w-64 border-r border-slate-800 bg-tech-panel flex flex-col sticky top-0 h-screen">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-tech-accent rounded-xl flex items-center justify-center text-tech-bg font-black text-xl">N</div>
                <div class="flex flex-col">
                    <span class="text-sm font-black tracking-tighter text-tech-accent leading-none">NETBYTES</span>
                    <span class="text-[10px] font-bold text-slate-500 tracking-[0.2em]">CLOUD</span>
                    <span class="text-[8px] font-bold text-slate-400 tracking-tight mt-1 whitespace-nowrap">PENTESTERS THREAT HUNTER</span>
                </div>
            </div>
        </div>
        
        <nav class="flex-grow p-4 space-y-2">
            {% if user %}
                <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-sm font-bold text-slate-300 group-hover:text-white">Dashboard</span>
                </a>
                <a href="/alerts" class="flex items-center justify-between px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                    <div class="flex items-center space-x-3">
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span class="text-sm font-bold text-slate-300 group-hover:text-white">Alerts</span>
                    </div>
                    <div id="alert-notification-container" class="hidden flex items-center space-x-2">
                        <span id="alert-badge" class="flex h-5 w-5 items-center justify-center rounded-full bg-tech-danger text-[10px] font-bold text-white animate-pulse">0</span>
                        <button onclick="event.preventDefault(); event.stopPropagation(); clearNotifications();" class="p-1 hover:bg-slate-700 rounded-lg text-slate-500 hover:text-white transition-colors" title="Clear Notifications">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                </a>
                <a href="/domains" class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    <span class="text-sm font-bold text-slate-300 group-hover:text-white">Domains</span>
                </a>
                <a href="/statistics" class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span class="text-sm font-bold text-slate-300 group-hover:text-white">Statistics</span>
                </a>
                {% if user.is_admin %}
                    <a href="/admin" class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-800 group">
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-sm font-bold text-slate-300 group-hover:text-white">Admin</span>
                    </a>
                {% endif %}
            {% endif %}
        </nav>

        <div class="p-4 border-t border-slate-800 space-y-4">
            <button onclick="toggleDarkMode()" class="flex items-center space-x-3 w-full px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors text-slate-400 hover:text-white group">
                <svg id="sun-icon" class="w-5 h-5 hidden group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.071 16.071l.707.707M7.757 7.757l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
                <svg id="moon-icon" class="w-5 h-5 hidden group-hover:text-tech-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <span class="text-sm font-medium">Appearance</span>
            </button>
            {% if user %}
            <a href="/logout" class="flex items-center space-x-3 px-4 py-2 rounded-xl text-tech-danger hover:bg-tech-danger/10 transition-colors group">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="text-sm font-bold">Logout</span>
            </a>
            {% endif %}
        </div>
    </aside>
    {% endblock %}

    <!-- Main Content Area -->
    <main class="flex-grow overflow-y-auto">
        <div class="{% block container_class %}max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8{% endblock %}">
            {% block content %}{% endblock %}
        </div>
        
        <footer class="border-t border-slate-800 py-6 text-center text-[10px] font-mono uppercase tracking-[0.3em] text-slate-600">
            &copy; 2026 NETBYTES.CLOUD - PENTESTERS THREAT HUNTER
        </footer>
    </main>

    <script>
        async function fetchNotificationCount() {
            try {
                const resp = await fetch('/api/notifications/count');
                if (resp.ok) {
                    const data = await resp.json();
                    const container = document.getElementById('alert-notification-container');
                    const badge = document.getElementById('alert-badge');
                    
                    if (data.count > 0) {
                        badge.textContent = data.count > 9 ? '9+' : data.count;
                        container.classList.remove('hidden');
                    } else {
                        container.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('Failed to fetch notification count', e);
            }
        }

        async function clearNotifications() {
            try {
                const resp = await fetch('/api/notifications/clear', { method: 'POST' });
                if (resp.ok) {
                    fetchNotificationCount();
                }
            } catch (e) {
                console.error('Failed to clear notifications', e);
            }
        }

        // Initial fetch and set interval
        if (document.getElementById('alert-notification-container')) {
            fetchNotificationCount();
            setInterval(fetchNotificationCount, 30000); // Every 30 seconds
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateIcons();
        }

        function updateIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('sun-icon').classList.toggle('hidden', !isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', isDark);
        }

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
        updateIcons();
    </script>
</body>
</html>
