<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Netbytes.cloud{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            accent: '#38bdf8',
                            danger: '#ef4444',
                            success: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-white dark:bg-tech-bg text-slate-900 dark:text-slate-100 transition-colors duration-200; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-tech-bg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-tech-accent rounded-lg flex items-center justify-center text-tech-bg font-bold">N</div>
                    <span class="text-xl font-bold tracking-tight text-tech-accent">NETBYTES.CLOUD</span>
                </div>
                <div class="flex items-center space-x-6">
                    {% if user %}
                        <a href="/dashboard" class="text-sm font-medium hover:text-tech-accent transition-colors">Dashboard</a>
                        <a href="/alerts" class="text-sm font-medium hover:text-tech-accent transition-colors">Alerts</a>
                        {% if user.is_admin %}
                            <a href="/admin" class="text-sm font-medium hover:text-tech-accent transition-colors">Admin</a>
                        {% endif %}
                        <a href="/logout" class="text-sm font-medium text-tech-danger hover:opacity-80 transition-opacity">Logout</a>
                    {% endif %}
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.071 16.071l.707.707M7.757 7.757l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
                        <svg id="moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-sm text-slate-500">
        &copy; 2026 Recon Dashboard | Secure Access Only
    </footer>

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateIcons();
        }

        function updateIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('sun-icon').classList.toggle('hidden', !isDark);
            document.getElementById('moon-icon').classList.toggle('hidden', isDark);
        }

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
        updateIcons();
    </script>
</body>
</html>
