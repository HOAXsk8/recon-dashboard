{% extends "base.html" %}

{% block title %}Tools Monitoring - Netbytes.cloud{% endblock %}

{% block content %}
<script>
    // Global user role from server
    const USER_ROLE = "{{ user.role }}";
</script>

<div class="space-y-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-white">TOOLS <span class="text-tech-accent">MONITORING</span></h1>
            <p class="text-slate-400 mt-1 font-medium">Real-time status of background reconnaissance agents.</p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="fetchTools()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-sm transition-all flex items-center space-x-2 border border-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Refresh Status</span>
            </button>
        </div>
    </div>

    <!-- Tools Grid -->
    <div id="tools-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Loading skeletons -->
        <div class="bg-tech-panel p-8 rounded-3xl border border-slate-800 animate-pulse">
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-12 h-12 bg-slate-700 rounded-2xl"></div>
                <div class="space-y-2">
                    <div class="h-4 w-32 bg-slate-700 rounded"></div>
                    <div class="h-3 w-20 bg-slate-800 rounded"></div>
                </div>
            </div>
            <div class="h-10 bg-slate-800 rounded-xl"></div>
        </div>
    </div>
</div>

<!-- Modal Popover -->
<div id="tool-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="bg-tech-panel w-full max-w-md rounded-3xl border border-slate-800 shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-tech-accent border border-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </div>
                <div>
                    <h2 id="modal-tool-name" class="text-lg font-black text-white">AGENT CONTROL</h2>
                    <p id="modal-tool-key" class="text-[10px] font-mono text-slate-500 uppercase tracking-widest"></p>
                </div>
            </div>
            <button onclick="closeModal()" class="p-2 hover:bg-slate-800 rounded-xl text-slate-500 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="p-6 space-y-8">
            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 font-mono uppercase tracking-widest mb-1">Status</p>
                    <p id="modal-tool-status" class="text-sm font-black uppercase tracking-tight"></p>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 font-mono uppercase tracking-widest mb-1">Process ID</p>
                    <p id="modal-tool-pid" class="text-sm font-black font-mono text-white"></p>
                </div>
            </div>

            <!-- Controls (Visible for authorized users) -->
            <div id="modal-controls" class="space-y-6">
                <div class="flex flex-col space-y-2">
                    <label class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Parallel Workers (Max 5)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="modal-workers-input" min="1" max="5" 
                               class="flex-grow bg-slate-900 border border-slate-700 rounded-xl text-sm text-white px-4 py-3 focus:border-tech-accent focus:ring-1 focus:ring-tech-accent/50 outline-none transition-all font-mono">
                        <button id="modal-set-workers" class="px-6 py-3 bg-tech-accent text-tech-bg rounded-xl font-black text-xs uppercase tracking-tight hover:scale-105 transition-all active:scale-95">SET</button>
                    </div>
                </div>

                <div class="flex flex-col space-y-2">
                    <label class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Process Command</label>
                    <button id="modal-toggle-status" class="w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all border shadow-lg active:scale-95"></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentTools = [];

    async function fetchTools() {
        try {
            const resp = await fetch('/api/tools');
            if (!resp.ok) throw new Error('Failed to fetch tools');
            currentTools = await resp.json();
            renderTools(currentTools);
        } catch (e) {
            console.error(e);
            document.getElementById('tools-container').innerHTML = `
                <div class="col-span-full p-20 text-center bg-tech-panel rounded-3xl border border-tech-danger/20 text-tech-danger font-bold uppercase tracking-widest">
                    Failed to establish link with command center
                </div>
            `;
        }
    }

    function renderTools(tools) {
        const container = document.getElementById('tools-container');
        if (tools.length === 0) {
            container.innerHTML = `
                <div class="col-span-full p-20 text-center bg-tech-panel rounded-3xl border border-slate-800 text-slate-500 font-mono text-sm uppercase">
                    No active agents registered in the field.
                </div>
            `;
            return;
        }

        container.innerHTML = tools.map(t => {
            let statusColor = 'bg-slate-500';
            let statusText = t.status || 'Stopped';
            let pulseClass = '';

            if (statusText === 'Running') {
                statusColor = 'bg-tech-success';
                pulseClass = 'animate-pulse';
            } else if (statusText === 'Idle') {
                statusColor = 'bg-orange-500';
            } else if (statusText === 'Stopped') {
                statusColor = 'bg-tech-danger';
            }

            return `
                <div onclick="openModal('${t.key}')" class="bg-tech-panel p-8 rounded-3xl border border-slate-800 hover:border-tech-accent/50 transition-all group cursor-pointer relative overflow-hidden active:scale-95">
                    <div class="absolute top-0 left-0 w-1 h-full ${statusColor}"></div>
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-tech-accent border border-slate-800 group-hover:border-tech-accent/50 group-hover:shadow-[0_0_15px_rgba(56,189,248,0.2)] transition-all">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white group-hover:text-tech-accent transition-colors">${t.name}</h3>
                                <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">${t.key}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-900/50 px-3 py-1.5 rounded-full border border-slate-800">
                            <div class="w-2 h-2 rounded-full ${statusColor} ${pulseClass}"></div>
                            <span class="text-[10px] font-black uppercase tracking-tighter ${statusText === 'Running' ? 'text-tech-success' : (statusText === 'Idle' ? 'text-orange-500' : 'text-tech-danger')}">${statusText}</span>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500 uppercase font-bold tracking-tighter">Last Heartbeat</span>
                            <span class="text-slate-300 font-mono text-[10px]">${new Date(t.last_heartbeat).toLocaleString()}</span>
                        </div>
                        <div class="pt-4 border-t border-slate-800 flex justify-center">
                            <span class="text-[10px] text-tech-accent font-black uppercase tracking-[0.2em] animate-pulse">Click to Manage</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openModal(key) {
        const tool = currentTools.find(t => t.key === key);
        if (!tool) return;

        document.getElementById('modal-tool-name').innerText = tool.name;
        document.getElementById('modal-tool-key').innerText = tool.key;
        document.getElementById('modal-tool-pid').innerText = tool.pid || 'N/A';
        
        const statusEl = document.getElementById('modal-tool-status');
        statusEl.innerText = tool.status || 'Stopped';
        statusEl.className = `text-sm font-black uppercase tracking-tight ${tool.status === 'Running' ? 'text-tech-success' : (tool.status === 'Idle' ? 'text-orange-500' : 'text-tech-danger')}`;

        if (USER_ROLE === 'viewer') {
            document.getElementById('modal-controls').classList.add('hidden');
        } else {
            document.getElementById('modal-controls').classList.remove('hidden');
            
            const workersInput = document.getElementById('modal-workers-input');
            workersInput.value = tool.max_workers || 4;
            
            const setBtn = document.getElementById('modal-set-workers');
            setBtn.onclick = () => updateConfig(setBtn, tool.key, 'workers');

            const toggleBtn = document.getElementById('modal-toggle-status');
            const isStopped = tool.status === 'Stopped';
            toggleBtn.innerText = isStopped ? 'DEPLOY AGENT' : 'TERMINATE PROCESS';
            toggleBtn.className = `w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all border shadow-lg active:scale-95 ${isStopped ? 'bg-tech-success/10 text-tech-success hover:bg-tech-success hover:text-white border-tech-success/30' : 'bg-tech-danger/10 text-tech-danger hover:bg-tech-danger hover:text-white border-tech-danger/30'}`;
            toggleBtn.onclick = () => updateConfig(toggleBtn, tool.key, isStopped ? 'Start' : 'Stop');
        }

        document.getElementById('tool-modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('tool-modal').classList.add('hidden');
    }

    async function updateConfig(btn, key, type) {
        const originalText = btn.innerText;
        btn.innerText = '...';
        btn.disabled = true;

        let payload = {};
        if (type === 'workers') {
            const val = document.getElementById('modal-workers-input').value;
            payload = { max_workers: parseInt(val) };
        } else if (type === 'Start') {
            payload = { status: 'Idle' };
        } else if (type === 'Stop') {
            payload = { status: 'Stopped' };
        }

        try {
            const resp = await fetch(`/api/tools/${key}/config`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                await fetchTools();
                // Find updated tool and update modal view
                const updatedTool = currentTools.find(t => t.key === key);
                if (updatedTool) {
                    document.getElementById('modal-tool-status').innerText = updatedTool.status;
                    // Keep modal open but update status text
                    const isStopped = updatedTool.status === 'Stopped';
                    const toggleBtn = document.getElementById('modal-toggle-status');
                    toggleBtn.innerText = isStopped ? 'DEPLOY AGENT' : 'TERMINATE PROCESS';
                    toggleBtn.className = `w-full py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all border shadow-lg active:scale-95 ${isStopped ? 'bg-tech-success/10 text-tech-success hover:bg-tech-success hover:text-white border-tech-success/30' : 'bg-tech-danger/10 text-tech-danger hover:bg-tech-danger hover:text-white border-tech-danger/30'}`;
                    toggleBtn.onclick = () => updateConfig(toggleBtn, updatedTool.key, isStopped ? 'Start' : 'Stop');
                }
            } else {
                alert('Update Rejected by Command Center');
            }
        } catch (e) {
            console.error(e);
            alert('Signal Lost: Communication Error');
        } finally {
            if (btn) {
                btn.innerText = (type === 'workers') ? 'SET' : (payload.status === 'Stopped' ? 'TERMINATE PROCESS' : 'DEPLOY AGENT');
                btn.disabled = false;
            }
        }
    }

    // Close on click outside
    window.onclick = function(event) {
        const modal = document.getElementById('tool-modal');
        if (event.target == modal) {
            closeModal();
        }
    }

    document.addEventListener('DOMContentLoaded', fetchTools);
    setInterval(fetchTools, 10000); // Update every 10s
</script>
{% endblock %}
