{% extends "base.html" %}

{% block title %}Tools Monitoring - Netbytes.cloud{% endblock %}

{% block content %}
<div class="space-y-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-white">TOOLS <span class="text-tech-accent">MONITORING</span></h1>
            <p class="text-slate-400 mt-1 font-medium">Real-time status of background reconnaissance agents.</p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="fetchTools()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-sm transition-all flex items-center space-x-2 border border-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Refresh Status</span>
            </button>
        </div>
    </div>

    <!-- Tools Grid -->
    <div id="tools-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Loading skeletons -->
        <div class="bg-tech-panel p-8 rounded-3xl border border-slate-800 animate-pulse">
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-12 h-12 bg-slate-700 rounded-2xl"></div>
                <div class="space-y-2">
                    <div class="h-4 w-32 bg-slate-700 rounded"></div>
                    <div class="h-3 w-20 bg-slate-800 rounded"></div>
                </div>
            </div>
            <div class="h-10 bg-slate-800 rounded-xl"></div>
        </div>
    </div>
</div>

<script>
    async function fetchTools() {
        try {
            const resp = await fetch('/api/tools');
            if (!resp.ok) throw new Error('Failed to fetch tools');
            const data = await resp.json();
            renderTools(data);
        } catch (e) {
            console.error(e);
            document.getElementById('tools-container').innerHTML = `
                <div class="col-span-full p-20 text-center bg-tech-panel rounded-3xl border border-tech-danger/20 text-tech-danger font-bold uppercase tracking-widest">
                    Failed to establish link with command center
                </div>
            `;
        }
    }

    function renderTools(tools) {
        const container = document.getElementById('tools-container');
        if (tools.length === 0) {
            container.innerHTML = `
                <div class="col-span-full p-20 text-center bg-tech-panel rounded-3xl border border-slate-800 text-slate-500 font-mono text-sm uppercase">
                    No active agents registered in the field.
                </div>
            `;
            return;
        }

        container.innerHTML = tools.map(t => {
            let statusColor = 'bg-slate-500';
            let statusText = t.status || 'Stopped';
            let pulseClass = '';

            if (statusText === 'Running') {
                statusColor = 'bg-tech-success';
                pulseClass = 'animate-pulse';
            } else if (statusText === 'Idle') {
                statusColor = 'bg-orange-500';
            } else if (statusText === 'Stopped') {
                statusColor = 'bg-tech-danger';
            }

            return `
                <div class="bg-tech-panel p-8 rounded-3xl border border-slate-800 hover:border-slate-700 transition-all group relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full ${statusColor}"></div>
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-tech-accent border border-slate-800">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white group-hover:text-tech-accent transition-colors">${t.name}</h3>
                                <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">PID: ${t.pid || 'N/A'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full ${statusColor} ${pulseClass}"></div>
                            <span class="text-[10px] font-bold uppercase tracking-tighter ${statusText === 'Running' ? 'text-tech-success' : (statusText === 'Idle' ? 'text-orange-500' : 'text-tech-danger')}">${statusText}</span>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500 uppercase font-bold tracking-tighter">Last Heartbeat</span>
                            <span class="text-slate-300 font-mono">${new Date(t.last_heartbeat).toLocaleString()}</span>
                        </div>
                        <!-- Action Controls -->
                        <div class="pt-6 border-t border-slate-800/50 space-y-6">
                            <!-- Worker Scaling -->
                            <div class="flex flex-col space-y-2">
                                <label class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Parallel Workers</label>
                                <div class="flex items-center space-x-2">
                                    <div class="relative flex-grow">
                                        <input type="number" value="${t.max_workers || 4}" min="1" max="20" id="workers-${t.key}" 
                                               class="w-full bg-slate-900/50 border border-slate-700 rounded-xl text-sm text-white px-4 py-2 focus:border-tech-accent focus:ring-1 focus:ring-tech-accent/50 outline-none transition-all font-mono">
                                    </div>
                                    <button onclick="updateConfig('${t.key}', 'workers')" 
                                            class="px-4 py-2 bg-slate-800 hover:bg-tech-accent hover:text-tech-bg text-tech-accent rounded-xl transition-all font-black text-xs uppercase tracking-tight border border-tech-accent/20">
                                        SET
                                    </button>
                                </div>
                            </div>

                            <!-- Execution Toggle -->
                            <div class="flex flex-col space-y-2">
                                <label class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Process Control</label>
                                <button onclick="updateConfig('${t.key}', '${statusText === 'Stopped' ? 'Start' : 'Stop'}')" 
                                        class="w-full py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all border shadow-lg active:scale-95 ${statusText === 'Stopped' ? 'bg-tech-success/10 text-tech-success hover:bg-tech-success hover:text-white border-tech-success/30' : 'bg-tech-danger/10 text-tech-danger hover:bg-tech-danger hover:text-white border-tech-danger/30'}">
                                    ${statusText === 'Stopped' ? 'DEPLOY AGENT' : 'TERMINATE PROCESS'}
                                </button>
                            </div>
                        </div>

                        <!-- Footer Info -->
                        <div class="pt-4 flex items-center justify-between border-t border-slate-800/30">
                            <span class="text-[9px] text-slate-600 font-mono uppercase tracking-widest">ID: ${t.key}</span>
                            <div class="flex items-center space-x-1">
                                <span class="w-1.5 h-1.5 rounded-full ${statusColor}"></span>
                                <span class="text-[9px] text-slate-500 font-bold uppercase">${statusText}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function updateConfig(key, type) {
        const btn = event.currentTarget;
        const originalText = btn.innerText;
        btn.innerText = '...';
        btn.disabled = true;

        let payload = {};
        if (type === 'workers') {
            const val = document.getElementById(`workers-${key}`).value;
            payload = { max_workers: parseInt(val) };
        } else if (type === 'Start') {
            payload = { status: 'Idle' };
        } else if (type === 'Stop') {
            payload = { status: 'Stopped' };
        }

        try {
            const resp = await fetch(`/api/tools/${key}/config`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                await fetchTools();
            } else {
                alert('Update Rejected by Command Center');
            }
        } catch (e) {
            console.error(e);
            alert('Signal Lost: Communication Error');
        } finally {
            if (btn) {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', fetchTools);
    setInterval(fetchTools, 10000); // Update every 10s
</script>
{% endblock %}
