version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: recon-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: always
    network_mode: "host"

  dashboard:
    build: .
    image: recon-dashboard:latest
    container_name: recon-dashboard
    command: [ "./start.sh" ]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - ADMIN_INITIAL_TOTP_SECRET=${ADMIN_INITIAL_TOTP_SECRET}
      - DISABLE_2FA=${DISABLE_2FA:-true}
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tools:/app/tools
      - ./screenshots:/app/screenshots
      - ./recovered_sources:/app/recovered_sources
    restart: always
    network_mode: "host"
    depends_on:
      - db

  proxy:
    image: caddy:latest
    container_name: recon-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    network_mode: "host"
    depends_on:
      - dashboard

  subdomain-discovery:
    image: recon-dashboard:latest
    container_name: subdomain-discovery
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: [ "python", "tools/subdomain_discovery.py" ]
    volumes:
      - ./tools:/app/tools
    restart: always
    init: true
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  alive-check:
