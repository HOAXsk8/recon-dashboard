  dynamic-js-collector:
    image: recon-dashboard:latest
    container_name: dynamic-js-collector
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - PYTHONUNBUFFERED=1
    command: ["python", "tools/dynamic_js_collector.py"]
    volumes:
      - ./tools:/app/tools
      - ./recovered_sources:/app/recovered_sources
    restart: always
    init: true
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  cloud-storage-auditor:
    image: recon-dashboard:latest
    container_name: cloud-storage-auditor
    environment:
      - MONGO_HOST=localhost
