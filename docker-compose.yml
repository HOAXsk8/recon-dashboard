      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/screenshot_agent.py"]
    volumes:
      - ./tools:/app/tools
      - ./screenshots:/app/screenshots
    restart: always
    init: true
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  archive-hunter:
