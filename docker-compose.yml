version: '3.8'

services:
  dashboard:
    build: .
    container_name: recon-dashboard
    environment:
      - SECRET_KEY=38b7e2a94faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - MONGO_HOST=localhost
    restart: always
    network_mode: "host"

  c-scanner:
    build: .
    container_name: recon-c-scanner
    command: ["./tools/scanners/C_port_scanner"]
    restart: always
    network_mode: "host"
    depends_on:
      - dashboard

  proxy:
    image: caddy:latest
    container_name: recon-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    network_mode: "host"

volumes:
  caddy_data:
  caddy_config:
