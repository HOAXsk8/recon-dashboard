version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: recon-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: always
    network_mode: "host"

  dashboard:
    build: .
    container_name: recon-dashboard
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    restart: always
    network_mode: "host"
    depends_on:
      - db

  proxy:
    image: caddy:latest
    container_name: recon-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    network_mode: "host"
    depends_on:
      - dashboard

  subdomain-discovery:
    build: .
    container_name: subdomain-discovery
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/subdomain_discovery.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  alive-check:
    build: .
    container_name: alive-check
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/alive_check.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  port-scanner:
    build: .
    container_name: port-scanner
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/port_scanner.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  whois-lookup:
    build: .
    container_name: whois-lookup
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/whois_agent.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
