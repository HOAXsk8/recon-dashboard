version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: recon-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: always
    network_mode: "host"

  dashboard:
    build: .
    container_name: recon-dashboard
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tools:/app/tools
    restart: always
    network_mode: "host"
    depends_on:
      - db

  proxy:
    image: caddy:latest
    container_name: recon-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    network_mode: "host"
    depends_on:
      - dashboard

  subdomain-discovery:
    build: .
    container_name: subdomain-discovery
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/subdomain_discovery.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  alive-check:
    build: .
    container_name: alive-check
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/alive_check.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  port-scanner:
    build: .
    container_name: port-scanner
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/port_scanner.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  whois-lookup:
    build: .
    container_name: whois-lookup
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/whois_agent.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  directory-hunter:
    build: .
    container_name: directory-hunter
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/directory_hunter.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  tech-fingerprinter:
    build: .
    container_name: tech-fingerprinter
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/tech_fingerprinter.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  loop-orchestrator:
    build: .
    container_name: loop-orchestrator
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/loop_orchestrator.py"]
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  js-miner:
    build: .
    container_name: js-miner
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/js_miner.py"]
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tools:/app/tools
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

  bypass-403:
    build: .
    container_name: bypass-403
    environment:
      - MONGO_HOST=localhost
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    command: ["python", "tools/bypass_403.py"]
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tools:/app/tools
    restart: always
    network_mode: "host"
    depends_on:
      - db
      - dashboard

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
