version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: recon-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: always
    network_mode: "host"

  dashboard:
    build: .
    container_name: recon-dashboard
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=localhost
    restart: always
    network_mode: "host"
    depends_on:
      - db

  proxy:
    image: caddy:latest
    container_name: recon-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    network_mode: "host"
    depends_on:
      - dashboard

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
